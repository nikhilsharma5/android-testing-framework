name: CI Status

on:
  workflow_run:
    workflows: ["Unit Tests", "PR Checks"]
    types: [completed]

jobs:
  status-check:
    name: Report Status
    runs-on: ubuntu-latest

    steps:
      - name: Check CI Status
        run: |
          echo "Workflow Conclusion: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "✅ CI Pipeline Passed"
          else
            echo "⚠️ CI Pipeline Status: ${{ github.event.workflow_run.conclusion }}"
          fi
