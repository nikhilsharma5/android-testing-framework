name: CI Status

on:
  workflow_run:
    workflows: ["Unit Tests", "PR Checks"]
    types: [completed]

jobs:
  status-check:
    name: Report Status
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "✅ CI Pipeline Passed"
            exit 0
          else
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
