version: 2.1

jobs:
  unit_tests:
    docker:
      - image: cimg/android:2024.01
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3200m"
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-cache-
      - run:
          name: Accept Android SDK licenses
          command: |
            yes | sdkmanager --licenses || true
      - run:
          name: Download Android SDK components
          command: |
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - run:
          name: Run unit tests
          command: |
            chmod +x ./gradlew
            ./gradlew test --no-daemon --stacktrace
      - save_cache:
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle
            - ~/.android
      - store_test_results:
          path: app/build/test-results/test/
      - store_artifacts:
          path: app/build/reports/tests/test/
          destination: test-reports
      - store_artifacts:
          path: app/build
          destination: build-logs

workflows:
  test_suite:
    jobs:
      - unit_tests
