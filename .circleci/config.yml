version: 2.1

jobs:
  unit_tests:
    docker:
      - image: cimg/android:2024.01
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3200m"
      ANDROID_HOME: /home/circleci/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-cache-

      - run:
          name: Setup environment
          command: |
            echo "ANDROID_HOME is $ANDROID_HOME"
            ls -la gradle/wrapper/ || echo "Wrapper files not found"

      - run:
          name: Accept Android SDK licenses
          command: |
            yes | sdkmanager --licenses 2>/dev/null || true

      - run:
          name: Download Android SDK components
          command: |
            sdkmanager "platforms;android-34" \
                      "build-tools;34.0.0" \
                      "system-images;android-34;google_apis;x86" 2>/dev/null || true

      - run:
          name: Build project
          command: |
            chmod +x ./gradlew
            ./gradlew --version
            ./gradlew build -x connectedAndroidTest --no-daemon --stacktrace

      - run:
          name: Run unit tests
          command: |
            ./gradlew test --no-daemon --stacktrace

      - save_cache:
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle
            - ~/.android
            - ~/android-sdk

      - store_test_results:
          path: app/build/test-results/test/

      - store_artifacts:
          path: app/build/reports/tests/test/
          destination: test-reports

      - store_artifacts:
          path: app/build
          destination: build-logs

  instrumented_tests:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3200m"
      ANDROID_HOME: /home/circleci/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-cache-

      - run:
          name: Accept Android SDK licenses
          command: |
            yes | sdkmanager --licenses 2>/dev/null || true

      - run:
          name: Download Android SDK and create emulator
          command: |
            sdkmanager "platforms;android-34" \
                      "build-tools;34.0.0" \
                      "system-images;android-34;google_apis;x86" 2>/dev/null || true
            echo no | avdmanager create avd -n test-emulator -k "system-images;android-34;google_apis;x86" --force

      - run:
          name: Start emulator
          command: |
            chmod +x ./gradlew
            emulator -avd test-emulator -no-window -no-audio -no-boot-anim &
            sleep 30
            adb wait-for-device
            adb shell setprop sys.usb.config adb
            sleep 10
          background: true

      - run:
          name: Build and run instrumented tests
          command: |
            ./gradlew connectedAndroidTest --no-daemon --stacktrace

      - save_cache:
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle
            - ~/.android
            - ~/android-sdk

      - store_test_results:
          path: app/build/outputs/androidTest-results/connected/

      - store_artifacts:
          path: app/build/reports/androidTests/connected/
          destination: instrumented-test-reports

      - store_artifacts:
          path: app/build
          destination: build-logs

workflows:
  test_suite:
    jobs:
      - unit_tests
      - instrumented_tests
