version: 2.1

jobs:
  unit_tests:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout
      - restore_cache:
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Run unit tests
          command: ./gradlew test --no-daemon
      - save_cache:
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle
      - store_test_results:
          path: app/build/test-results/test/
      - store_artifacts:
          path: app/build/reports/tests/test/
          destination: test-reports

workflows:
  test_suite:
    jobs:
      - unit_tests
